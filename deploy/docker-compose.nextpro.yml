# Site do livro (outromanifesto.space) no VPS do nextpro — isolado em /opt/livro.
# Migrado do VPS boringco em 2026-11-11. Rede infra-internal só para falar com o Listmonk (alias "listmonk").
name: livro
services:
  livro-web:
    image: ${IMAGE_REF:-ghcr.io/lglucas/outromanifestocypherpunk:latest}
    container_name: livro-web
    restart: always
    env_file: /opt/livro/.env
    environment:
      - TZ=America/Sao_Paulo
    expose:
      - "3000"
    mem_limit: 512m
    networks: [default, infra-internal]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
  livro-cloudflared:
    image: cloudflare/cloudflared:2026.6.1
    container_name: livro-cloudflared
    restart: always
    command: tunnel --no-autoupdate run
    env_file: /opt/livro/tunnel.env
    mem_limit: 128m
    depends_on: [livro-web]
    networks: [default]
networks:
  infra-internal:
    external: true
    name: infra-internal
